# conda env create -f environment.yml   then   conda activate geocrop
name: geocrop
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - xarray
  - dask
  - netcdf4
  - geopandas
  - pyogrio
  - shapely
  - pyproj
  - rasterio
  - rioxarray
  - owslib
  - cdsapi
  - scipy
  - requests
  - pip
  - pip:
      - geoaquacrop_preprocess>=0.1.0
      - geoaquacrop_simulate>=0.1.1
      - aquacrop>=3.1.0
      - soilgrids
      - dnspython
      - fastapi>=0.110
      - uvicorn[standard]>=0.29
      - python-multipart>=0.0.9
      - httpx>=0.27
